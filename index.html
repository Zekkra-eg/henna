<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Invitation</title>


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGE
    ========================= */

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       VIDEOS
    ========================= */

    video {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    #video1 {

      z-index: 1;

    }


    #video2 {

      z-index: 2;

      opacity: 0;

      transition:
        opacity 0.15s ease;

      pointer-events: none;

    }


    #video2.show {

      opacity: 1;

      pointer-events: auto;

    }


    /* =========================
       AUDIO
    ========================= */

    #bg-music {

      position: absolute;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;

    }


    /* =========================
       CONFETTI
    ========================= */

    #confetti {

      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

      overflow: hidden;

      background: transparent;

    }


    .piece {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 15px;

      opacity: 0;

      border-radius: 2px;

      animation:
        confettiExplosion
        2.8s
        cubic-bezier(.15, .7, .3, 1)
        forwards;

    }


    @keyframes confettiExplosion {

      0% {

        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(0deg)
          scale(0.4);

        opacity: 1;

      }


      15% {

        opacity: 1;

      }


      100% {

        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(1);

        opacity: 0;

      }

    }


    /* =========================
       TAP AREA
    ========================= */

    #tapArea {

      position: absolute;

      z-index: 20;

      width: 70%;
      height: 45%;

      left: 15%;
      top: 27.5%;

      cursor: pointer;

      background: transparent;

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      touch-action: manipulation;

      display: none;

    }


    #tapArea.active {

      display: block;

    }


    /* =========================
       SOUND ERROR / FALLBACK
    ========================= */

    #soundMessage {

      position: fixed;

      z-index: 200;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      display: none;

      padding: 12px 20px;

      border-radius: 30px;

      background: rgba(0,0,0,0.85);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

      text-align: center;

      white-space: nowrap;

    }


    #soundMessage.show {

      display: block;

    }


    /* =========================
       SOUND BUTTON
    ========================= */

    #soundButton {

      position: fixed;

      z-index: 250;

      right: 22px;

      bottom: 22px;

      min-width: 70px;

      height: 38px;

      padding: 0 15px;

      border-radius: 20px;

      border: 1px solid rgba(255,255,255,0.4);

      background: rgba(0,0,0,0.18);

      backdrop-filter: blur(4px);

      -webkit-backdrop-filter: blur(4px);

      display: none;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      outline: none;

      -webkit-tap-highlight-color: transparent;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.15);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 1.5px;

      line-height: 1;

      animation:
        soundButtonFloat
        2.2s
        ease-in-out
        infinite;

    }


    #soundButton.show {

      display: flex;

    }


    #soundButton:active {

      transform: scale(0.88);

    }


    @keyframes soundButtonFloat {

      0%,
      100% {

        transform: scale(1);

      }

      50% {

        transform: scale(1.05);

      }

    }



    /* =========================
       CANVA INVITATION EMBED
    ========================= */
    #invitationEmbed {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: auto;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
    }

    #invitationEmbed .canva-embed-frame {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 542.0937%;
      padding-bottom: 0;
      box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
      margin-top: 1.6em;
      margin-bottom: 0.9em;
      overflow: hidden;
      border-radius: 8px;
      will-change: transform;
    }

    #invitationEmbed iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: none;
      padding: 0;
      margin: 0;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       VIDEO 1
  ========================= -->

  <video
    id="video1"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
  >

    <source
      src="5.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       VIDEO 2
  ========================= -->

  <video
    id="video2"
    muted
    playsinline
    webkit-playsinline
    loop
    preload="auto"
  >

    <source
      src="6.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       AUDIO
  ========================= -->

  <audio
    id="bg-music"
    src="song2.mp3"
    loop
    preload="auto"
  ></audio>


  <!-- =========================
       CONFETTI
  ========================= -->

  <div id="confetti"></div>


  <!-- =========================
       TAP AREA
  ========================= -->

  <div id="tapArea"></div>


  <!-- =========================
       SOUND MESSAGE
  ========================= -->

  <div id="soundMessage">
    Tap again to play the music
  </div>


  <!-- =========================
       SOUND BUTTON
       PLAY / MUTE
  ========================= -->

  <button
    id="soundButton"
    aria-label="Toggle music"
    type="button"
  >
    <span id="soundButtonText">
      MUTE
    </span>
  </button>

</div>


<script>


  /* =========================
     ELEMENTS
     ========================= */

  const video1 =
    document.getElementById("video1");

  const video2 =
    document.getElementById("video2");

  const audio =
    document.getElementById("bg-music");

  const confetti =
    document.getElementById("confetti");

  const tapArea =
    document.getElementById("tapArea");

  const soundMessage =
    document.getElementById("soundMessage");

  const soundButton =
    document.getElementById("soundButton");

  const soundButtonText =
    document.getElementById(
      "soundButtonText"
    );
/* =========================
     VIDEO 1
     ========================= */

  video1.play().catch(error => {

    console.log(
      "Video 1 autoplay blocked:",
      error
    );

  });


  /* =========================
     VIDEO 1 ENDED
     ========================= */

  video1.addEventListener(
    "ended",
    startVideo2
  );


  /* =========================
     START VIDEO 2
     ========================= */

  function startVideo2() {

    video2.currentTime = 0;


    video2.play().catch(error => {

      console.log(
        "Video 2 play error:",
        error
      );

    });


    video2.classList.add(
      "show"
    );


    setTimeout(() => {

      video1.style.display =
        "none";

    }, 200);


    tapArea.classList.add(
      "active"
    );


    createConfetti();

  }


  /* =========================
     CONFETTI
     ========================= */

  function createConfetti() {

    confetti.innerHTML = "";


    const colors = [

      "#FFD166",
      "#EF476F",
      "#06D6A0",
      "#118AB2",
      "#8338EC",
      "#FF9F1C",
      "#FF70A6",
      "#FFFFFF"

    ];


    const pieces = 120;


    for (
      let i = 0;
      i < pieces;
      i++
    ) {

      const piece =
        document.createElement(
          "div"
        );


      piece.className =
        "piece";


      const angle =
        Math.random()
        * Math.PI
        * 2;


      const distance =
        300 +
        Math.random() * 650;


      const x =
        Math.cos(angle)
        * distance;


      const y =
        Math.sin(angle)
        * distance;


      piece.style.setProperty(
        "--x",
        x + "px"
      );


      piece.style.setProperty(
        "--y",
        y + "px"
      );


      piece.style.setProperty(
        "--rotation",
        (
          Math.random() * 1200
          - 600
        ) + "deg"
      );


      piece.style.background =
        colors[
          Math.floor(
            Math.random()
            * colors.length
          )
        ];


      piece.style.width =
        (
          5 +
          Math.random() * 8
        ) + "px";


      piece.style.height =
        (
          8 +
          Math.random() * 16
        ) + "px";


      piece.style.animationDelay =
        (
          Math.random() * 0.12
        ) + "s";


      confetti.appendChild(
        piece
      );

    }


    setTimeout(() => {

      confetti.innerHTML = "";

    }, 3500);

  }


  /* =====================================================
     AUDIO
     ===================================================== */

  let audioStarted = false;


  async function startMusic() {

    if (audioStarted) {

      return true;

    }


    audio.volume = 1;

    audio.muted = false;


    try {

      await audio.play();

      audioStarted = true;


      soundButton.classList.add(
        "show"
      );


      soundButtonText.textContent =
        "MUTE";


      console.log(
        "HTML AUDIO STARTED"
      );


      return true;

    }

    catch (error) {

      console.warn(
        "HTML audio failed:",
        error
      );

      return false;

    }

  }


  /* =====================================================
     PLAY / MUTE BUTTON
     ===================================================== */

  soundButton.addEventListener(
    "click",
    async function (event) {

      event.stopPropagation();


      if (
        audio.paused
      ) {

        try {

          await audio.play();

          soundButtonText.textContent =
            "MUTE";

        }

        catch (error) {

          console.warn(
            "Audio play failed:",
            error
          );

        }

      }

      else {

        audio.pause();

        soundButtonText.textContent =
          "PLAY";

      }

    }
  );


  /* =====================================================
     SHOW THE CANVA INVITATION EMBED
     ===================================================== */
  function openInvitationWebsite() {
    video1.pause();
    video2.pause();
    video1.style.display = "none";
    video2.style.display = "none";
    tapArea.style.display = "none";
    confetti.innerHTML = "";
    soundMessage.classList.remove("show");
    document.getElementById("invitationEmbed").style.display = "block";
  }


  /* =====================================================
     OPEN INVITATION
     ===================================================== */

  let opened = false;


  tapArea.addEventListener(
    "click",
    async function () {


      if (opened) {

        return;

      }


      if (
        !video2.classList.contains(
          "show"
        )
      ) {

        return;

      }


      opened = true;
      soundMessage.classList.remove("show");

      // Attempt playback, then redirect either way.
      // Audio stops when the browser navigates to the destination.
      startMusic();
      openInvitationWebsite();


    },
    {
      passive: true
    }
  );


  /* =====================================================
     KEEP BUTTON IN SYNC
     ===================================================== */

  audio.addEventListener(
    "play",
    function () {

      soundButtonText.textContent =
        "MUTE";

    }
  );


  audio.addEventListener(
    "pause",
    function () {

      soundButtonText.textContent =
        "PLAY";

    }
  );


</script>

</div>

</body>
